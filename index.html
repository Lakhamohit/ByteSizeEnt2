<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ByteSizeEnt – By filmmakers, for filmmakers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1a1b1e;--panel:#232427;--line:#34363b;--text:#fff;--mute:#b4b7bd;--acc:#d9b96c;--r:10px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:Manrope,Inter,system-ui,sans-serif;margin:0;line-height:1.1}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,56px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(26,27,30,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:20px;height:64px}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.01em;margin-right:auto}
.brand b{color:var(--acc);font-weight:800}
nav a.l{font-family:Manrope;font-weight:700;font-size:.95rem;color:var(--mute);padding:6px 2px;border-bottom:2px solid transparent}
nav a.l:hover,nav a.l.on{color:var(--text);border-color:var(--acc)}
.sbox{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:0 14px;width:min(260px,34vw)}
.sbox input{background:none;border:0;outline:0;width:100%;padding:9px 0;min-width:0}
.sbox:focus-within{border-color:var(--acc)}
.btn{display:inline-block;border:1.5px solid var(--text);background:none;border-radius:99px;padding:12px 26px;font-family:Manrope;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:var(--text);color:var(--bg)}
.btn.f{background:var(--acc);border-color:var(--acc);color:#1a1b1e}
.btn.f:hover{background:#ecd08a;border-color:#ecd08a}
.btn[disabled]{opacity:.45;cursor:not-allowed;background:none;color:var(--text)}
.hero{padding:clamp(48px,9vw,112px) 0 48px}
.hero small{color:var(--mute);font-size:1rem}
.hero h1{font-size:clamp(2.2rem,6.4vw,4.8rem);font-weight:800;letter-spacing:-.02em;max-width:15ch;margin:14px 0 18px}
.hero p{color:var(--mute);max-width:52ch;font-size:1.1rem;margin:0 0 28px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.hero .btn{min-width:200px;text-align:center}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:56px}
.cat{position:relative;min-height:300px;border-radius:var(--r);padding:28px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;border:1px solid var(--line);transition:border-color .2s}
.cat:hover{border-color:var(--acc)}
.cat h2{font-size:2.2rem;font-weight:800}
.cat span{color:var(--mute)}
.cat p{margin:8px 0 14px;max-width:38ch}
.cat em{font-style:normal;font-weight:700;font-family:Manrope;color:var(--acc)}
.c-p{background:linear-gradient(180deg,rgba(26,27,30,.1),rgba(26,27,30,.92)),linear-gradient(135deg,#6d5a3d,#2b2a30 70%)}
.c-a{background:linear-gradient(180deg,rgba(26,27,30,.1),rgba(26,27,30,.92)),linear-gradient(135deg,#3d5a6d,#2b2a30 70%)}
.big{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:56px}
.big input{flex:1;background:none;border:0;outline:0;padding:10px 12px;min-width:0}
section.blk{margin-bottom:52px}
section.blk>h2{font-size:1.5rem;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px 16px}
.card{display:block}
.poster{aspect-ratio:2/3;border-radius:8px;position:relative;overflow:hidden;border:1px solid var(--line);transition:transform .2s,border-color .2s}
.card:hover .poster,.card:focus-visible .poster{transform:translateY(-4px);border-color:var(--acc)}
.poster i{position:absolute;left:10px;bottom:10px;right:10px;font:800 1.05rem/1.1 Manrope;font-style:normal;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);border-radius:99px;padding:2px 9px;font:700 .72rem Manrope}
.card h3{font-size:1rem;margin:10px 0 2px}
.meta{color:var(--mute);font-size:.85rem}
.genres{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:10px 20px;font-family:Manrope;font-weight:700;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);color:#1a1b1e;border-color:var(--acc)}
.note{color:var(--mute);font-size:.82rem;margin-top:10px}
.bwrap{display:grid;grid-template-columns:230px 1fr;gap:32px;padding-top:36px}
.filters{display:grid;gap:14px;align-content:start}
.filters label{display:grid;gap:5px;font-size:.88rem;color:var(--mute)}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.ftog{display:none}
.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:clamp(1.8rem,4vw,2.6rem)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:40px;text-align:center;color:var(--mute)}
.det{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:clamp(24px,5vw,64px);padding:40px 0 56px}
.det .poster{aspect-ratio:2/3}
.det h1{font-size:clamp(2rem,5vw,3.6rem);font-weight:800;margin:10px 0 14px}
.det .syn{font-size:1.12rem;color:#e4e5e8;max-width:56ch}
dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 24px;margin:28px 0;padding:22px 0;border-block:1px solid var(--line)}
dt{color:var(--mute);font-size:.85rem}dd{margin:2px 0 0;font-weight:500}
.eps{list-style:none;padding:0;margin:0 0 32px;max-width:640px}
.eps li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.back{display:inline-block;margin-top:28px;color:var(--mute)}
.back:hover{color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:9;padding:20px}
.modal.open{display:grid}
.modal div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:28px;max-width:440px}
footer{border-top:1px solid var(--line);padding:36px 0 44px;color:var(--mute);font-size:.92rem}
.fgrid{display:flex;gap:32px;flex-wrap:wrap;justify-content:space-between}
footer a{display:block;padding:2px 0}footer a:hover{color:var(--text)}
@media(max-width:820px){
.cats{grid-template-columns:1fr}.cat{min-height:220px}
.bwrap{grid-template-columns:1fr;gap:16px}
.ftog{display:inline-block;margin-bottom:12px}
.filters{display:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.filters.open{display:grid}
.grid{grid-template-columns:repeat(2,1fr)}
.det{grid-template-columns:1fr}.det .poster{max-width:240px}
.sbox{display:none}.big{flex-direction:column}
nav{gap:14px}.hero .btn{flex:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><nav aria-label="Main">
<a class="brand" href="#/">Byte<b>Size</b>Ent</a>
<a class="l" id="n-p" href="#/browse/p">FILMAKA</a>
<a class="l" id="n-a" href="#/browse/a">FILMAIKA</a>
<a class="l" href="#/about">About</a>
<form class="sbox" role="search" id="hs"><input type="search" id="hq" placeholder="Search films" aria-label="Search films"></form>
</nav></div></header>
<main id="app"></main>
<footer><div class="wrap"><div class="fgrid">
<div><div class="brand">Byte<b>Size</b>Ent</div><p>By filmmakers, for filmmakers.</p></div>
<div><a href="#/about">About the platform</a><a href="#/browse/p">FILMAKA</a><a href="#/browse/a">FILMAIKA</a></div>
<div><a href="#/about">Contact</a><a href="#/about">Privacy policy</a><a href="#/about">Terms of use</a></div>
</div><p>© 2026 ByteSizeEnt. All films shown are fictional sample titles.</p></div></footer>
<div class="modal" id="m" role="dialog" aria-modal="true"><div><h2 id="mt"></h2><p id="mp"></p><button class="btn f" id="mc">Close</button></div></div>

<script>
// Sample catalog. Replace with verified catalog data (Assignment 2) before launch.
const F=[
{id:1,t:"The Last Journey",c:"p",g:"Drama",y:2025,r:12,l:"English",co:"India",d:"Sample Director",h:32,s:"A retired railway signalman takes one final trip along the line he spent forty years guarding.",w:1,tr:1},
{id:2,t:"Monsoon Shift",c:"p",g:"Thriller",y:2024,r:18,l:"Hindi",co:"India",d:"Sample Director",h:12,s:"A night-shift nurse realises the patient in bed nine has been waiting for her.",w:1,tr:0},
{id:3,t:"Corner Table",c:"p",g:"Comedy",y:2025,r:9,l:"English",co:"UK",d:"Sample Director",h:42,s:"Two strangers keep booking the same cafe table, and neither will give it up.",w:1,tr:1},
{id:4,t:"Salt Road",c:"p",g:"Documentary",y:2023,r:24,l:"Spanish",co:"Chile",d:"Sample Director",h:200,s:"A walk with the families who still harvest salt by hand.",w:0,tr:0},
{id:5,t:"Paper Lanterns",c:"p",g:"Drama",y:2026,r:15,l:"Japanese",co:"Japan",d:"Sample Director",h:350,s:"A lantern maker teaches her last apprentice before the festival.",w:1,tr:1},
{id:6,t:"Static Bloom",c:"p",g:"Sci-fi",y:2025,r:20,l:"English",co:"USA",d:"Sample Director",h:270,s:"A radio operator receives a message from a garden that does not exist.",w:1,tr:0},
{id:7,t:"Echo Protocol",c:"a",g:"Sci-fi",y:2026,r:6,l:"English",co:"USA",d:"Sample Creator",h:210,s:"An archive assistant starts answering questions nobody has asked yet.",w:1,tr:1,ser:"Echo Protocol"},
{id:8,t:"Glass Orchard",c:"a",g:"Drama",y:2026,r:11,l:"French",co:"France",d:"Sample Creator",h:140,s:"Three sisters inherit an orchard grown entirely under glass.",w:1,tr:0},
{id:9,t:"The Quiet Algorithm",c:"a",g:"Thriller",y:2025,r:8,l:"English",co:"Canada",d:"Sample Creator",h:240,s:"A city council discovers its traffic system has been leaving notes.",w:1,tr:1},
{id:10,t:"Tiny Gods",c:"a",g:"Animation",y:2026,r:5,l:"Hindi",co:"India",d:"Sample Creator",h:20,s:"Small household spirits argue over who protects the kitchen.",w:1,tr:0},
{id:11,t:"Midnight Cartographer",c:"a",g:"Comedy",y:2025,r:10,l:"English",co:"Australia",d:"Sample Creator",h:300,s:"A mapmaker keeps drawing towns that then appear on the road.",w:0,tr:0},
{id:12,t:"Lowlight",c:"a",g:"Documentary",y:2026,r:14,l:"Korean",co:"South Korea",d:"Sample Creator",h:170,s:"An experimental portrait of a city after the last train.",w:1,tr:1}];
const EPS=[["Episode 1: The Query",6],["Episode 2: Cache",7],["Episode 3: Silence",5]];
const CN={p:"FILMAKA",a:"FILMAIKA"},CD={p:"Practical filmmaking",a:"AI filmmaking"};
const GEN=[...new Set(F.map(f=>f.g))].sort(),LANG=[...new Set(F.map(f=>f.l))].sort();
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bg=f=>`linear-gradient(160deg,hsl(${f.h} 38% 36%),hsl(${(f.h+50)%360} 30% 14%))`;
const card=f=>`<a class="card" href="#/film/${f.id}"><div class="poster" style="background:${bg(f)}"><span class="tag">${CN[f.c]}</span><i>${esc(f.t)}</i></div><h3>${esc(f.t)}</h3><div class="meta">${f.g} · ${f.y} · ${f.r} min</div></a>`;
const catPanel=k=>`<a class="cat c-${k}" href="#/browse/${k}"><span>${CD[k]}</span><h2>${CN[k]}</h2><p>${k=="p"?"Explore films created through practical shoots and production methods.":"Explore films and projects created using AI production workflows."}</p><em>Explore ${CN[k]} →</em></a>`;
const row=(k,t)=>`<section class="blk"><h2>${t}</h2><div class="grid">${F.filter(f=>f.c==k).slice(0,4).map(card).join("")}</div></section>`;

function home(){
 app.innerHTML=`<div class="wrap"><div class="hero"><small>By filmmakers, for filmmakers.</small><h1>Every way of filmmaking. One place to explore.</h1><p>Discover films and creative projects made through practical production and AI.</p><div class="row"><a class="btn f" href="#/browse/p">Explore FILMAKA</a><a class="btn f" href="#/browse/a">Explore FILMAIKA</a></div></div>
 <div class="cats">${catPanel("p")}${catPanel("a")}</div>
 <form class="big" id="bs" role="search"><input type="search" id="bq" placeholder="Search films, series, episodes, directors or keywords" aria-label="Search the library"><button class="btn f">Search</button></form>
 ${row("p","Featured in FILMAKA")}${row("a","Featured in FILMAIKA")}
 <section class="blk"><h2>Browse by genre</h2><div class="genres">${GEN.map(g=>`<a class="chip" href="#/browse/all?g=${g}">${g}</a>`).join("")}</div><p class="note">Genres come from the catalog. Titles shown are fictional samples.</p></section></div>`;
 $("#bs").onsubmit=e=>{e.preventDefault();location.hash="#/browse/all?q="+encodeURIComponent($("#bq").value)};
}

function browse(k,p){
 const st={q:p.get("q")||"",g:p.get("g")||"",l:p.get("l")||"",s:p.get("s")||"az"};
 const title=k=="all"?(st.q?`Results for “${esc(st.q)}”`:"Browse all films"):"Explore "+CN[k];
 app.innerHTML=`<div class="wrap"><div class="bwrap"><aside><button class="btn ftog" id="ft" aria-expanded="false">Filters</button><div class="filters" id="fl">
 <label>Category<select id="fc"><option value="all">All</option><option value="p">FILMAKA</option><option value="a">FILMAIKA</option></select></label>
 <label>Genre<select id="fg"><option value="">Any</option>${GEN.map(g=>`<option>${g}</option>`).join("")}</select></label>
 <label>Language<select id="fn"><option value="">Any</option>${LANG.map(g=>`<option>${g}</option>`).join("")}</select></label>
 <label>Sort by<select id="fs"><option value="az">A–Z</option><option value="new">Newest first</option><option value="short">Shortest runtime</option><option value="long">Longest runtime</option></select></label>
 <label>Search<input class="sbox" style="width:100%;padding:9px 14px;background:var(--panel);border:1px solid var(--line);border-radius:99px" id="fq" type="search" placeholder="Title, director, keyword"></label></div></aside>
 <div><div class="top"><div><h1>${title}</h1><div class="meta" id="cnt"></div></div></div><div id="res"></div></div></div></div>`;
 $("#fc").value=k;$("#fg").value=st.g;$("#fn").value=st.l;$("#fs").value=st.s;$("#fq").value=st.q;
 $("#ft").onclick=()=>{const o=$("#fl").classList.toggle("open");$("#ft").setAttribute("aria-expanded",o)};
 const run=()=>{
  const c=$("#fc").value,g=$("#fg").value,l=$("#fn").value,q=$("#fq").value.trim().toLowerCase(),s=$("#fs").value;
  let r=F.filter(f=>(c=="all"||f.c==c)&&(!g||f.g==g)&&(!l||f.l==l)&&(!q||(f.t+f.d+f.g+f.s+f.l+f.co).toLowerCase().includes(q)));
  r.sort(s=="az"?(a,b)=>a.t.localeCompare(b.t):s=="new"?(a,b)=>b.y-a.y:s=="short"?(a,b)=>a.r-b.r:(a,b)=>b.r-a.r);
  $("#cnt").textContent=r.length+(r.length==1?" title":" titles");
  $("#res").innerHTML=r.length?`<div class="grid">${r.map(card).join("")}</div>`:`<div class="empty"><h2>No titles match</h2><p>Try removing a filter or searching a different word.</p></div>`;
 };
 ["fc","fg","fn","fs"].forEach(i=>$("#"+i).onchange=run);$("#fq").oninput=run;run();
}

function film(id){
 const f=F.find(x=>x.id==id);if(!f){home();return}
 const rel=F.filter(x=>x.c==f.c&&x.id!=f.id).slice(0,4);
 app.innerHTML=`<div class="wrap"><a class="back" href="#/browse/${f.c}">← Back to ${CN[f.c]}</a><div class="det"><div class="poster" style="background:${bg(f)}"><i style="font-size:1.6rem">${esc(f.t)}</i></div><div>
 <div class="meta">${CN[f.c]} · ${f.g} · ${f.y}</div><h1>${esc(f.t)}</h1><p class="syn">${esc(f.s)}</p>
 <div class="row"><button class="btn f" id="w" ${f.w?"":"disabled"}>${f.w?"Watch film":"Not yet available"}</button>${f.tr?'<button class="btn" id="t">View trailer</button>':""}</div>
 <dl><div><dt>Runtime</dt><dd>${f.r} minutes</dd></div><div><dt>Language</dt><dd>${f.l}</dd></div><div><dt>Country</dt><dd>${f.co}</dd></div><div><dt>${f.c=="p"?"Director":"Creator"}</dt><dd>${f.d}</dd></div><div><dt>Genre</dt><dd>${f.g}</dd></div><div><dt>Release year</dt><dd>${f.y}</dd></div></dl>
 ${f.ser?`<h2 style="margin-bottom:8px;font-size:1.3rem">Episodes</h2><ul class="eps">${EPS.map(e=>`<li><span>${e[0]}</span><span class="meta">${e[1]} min</span></li>`).join("")}</ul>`:""}
 <p class="note">Sample content. The Watch button appears only when a video exists and rights allow playback.</p></div></div>
 <section class="blk"><h2>More from ${CN[f.c]}</h2><div class="grid">${rel.map(card).join("")}</div></section></div>`;
 const m=(a,b)=>{$("#mt").textContent=a;$("#mp").textContent=b;$("#m").classList.add("open");$("#mc").focus()};
 if(f.w)$("#w").onclick=()=>m("Playback placeholder","The video player will load "+f.t+" here once the video file is connected.");
 if(f.tr)$("#t").onclick=()=>m("Trailer placeholder","The trailer for "+f.t+" will play here.");
}

function about(){
 app.innerHTML=`<div class="wrap" style="padding:56px 0;max-width:760px"><h1 style="font-size:clamp(2rem,5vw,3.2rem);margin-bottom:18px">By filmmakers, for filmmakers.</h1><p style="font-size:1.1rem;color:#e4e5e8">ByteSizeEnt is a home for discovering filmmaking in every form. FILMAKA collects practical productions: live-action shoots and conventional methods. FILMAIKA collects projects made with AI production workflows.</p><p style="font-size:1.1rem;color:#e4e5e8">Both categories sit side by side with the same layout, filters and search. We do not take a side. We put the filmmaker first.</p><p class="meta">Contact, privacy policy and terms pages will be added before launch.</p><a class="btn f" href="#/">Back to home</a></div>`;
}

function route(){
 const [path,qs]=location.hash.slice(1).split("?"),p=new URLSearchParams(qs||""),seg=path.split("/").filter(Boolean);
 $("#m").classList.remove("open");
 if(seg[0]=="browse")browse(seg[1]||"all",p);else if(seg[0]=="film")film(seg[1]);else if(seg[0]=="about")about();else home();
 const c=seg[0]=="browse"?seg[1]:seg[0]=="film"?(F.find(x=>x.id==seg[1])||{}).c:"";
 $("#n-p").classList.toggle("on",c=="p");$("#n-a").classList.toggle("on",c=="a");
 scrollTo(0,0);
}
$("#hs").onsubmit=e=>{e.preventDefault();location.hash="#/browse/all?q="+encodeURIComponent($("#hq").value)};
$("#mc").onclick=()=>$("#m").classList.remove("open");
addEventListener("keydown",e=>{if(e.key=="Escape")$("#m").classList.remove("open")});
addEventListener("hashchange",route);route();
</script>
</body>
</html>
